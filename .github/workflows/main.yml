name: Create Files on Local Runner 
on:
  push:
    branches:
      - main  
jobs:
  create-files:
    runs-on: label1  
    steps:
      - name: Check runner location   
        run: pwd 

      - name: Create directory 
        run: mkdir -p /home/runner/files 

      - name: Create sample file 
        run: echo "This is a file generated from GitHub Actions" > /home/runner/files/sample.txt

      - name: Create file with date 
        run: date > /home/runner/files/date.txt

      - name: Show created files 
        run: ls -ltr /home/runner/files
      - name: show content
        run: cat /home/runner/files/sample.txt
      - name: show content
        run: cat /home/runner/files/date.txt
